name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Settimanale: intercetta le rotture dovute a nuove regole di HACS/hassfest.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Sintassi Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compila tutti i moduli
        run: python -m compileall -q custom_components/meteoeradar
      - name: Verifica la copertura dei codici simbolo
        run: python tests/test_symbols.py
